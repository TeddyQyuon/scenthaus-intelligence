services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scenthaus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d scenthaus]
      interval: 5s
      timeout: 5s
      retries: 20
  init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/scenthaus
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@scenthaus.demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ARTIFACT_DIR: /app/artifacts
      MLFLOW_TRACKING_URI: sqlite:////app/state/mlflow.db
      DEMO_MODE: 'true'
      ENVIRONMENT: development
    command: [bash, -c, 'alembic upgrade head && python -m app.seed && python -m app.ml.train']
    volumes: [models:/app/artifacts, mlflow-state:/app/state]
    depends_on:
      db: {condition: service_healthy}
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-env
    volumes: [models:/app/artifacts, mlflow-state:/app/state]
    ports: ['8000:8000']
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, -m, app.worker]
    environment: *backend-env
    volumes: [models:/app/artifacts, mlflow-state:/app/state]
    depends_on:
      init: {condition: service_completed_successfully}
  storefront:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ['5173:80']
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres-data:
  models:
  mlflow-state:
