[project]
name = "scenthaus-intelligence"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests", "ml/tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = ["legacy", ".venv", "tools/node_modules"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
