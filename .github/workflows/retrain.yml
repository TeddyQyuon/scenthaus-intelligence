name: Train and publish hosted models
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 6'
permissions:
  contents: write
concurrency:
  group: scenthaus-hosted-training
  cancel-in-progress: false
jobs:
  retrain:
    if: vars.SCENTHAUS_RETRAIN_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.SCENTHAUS_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SCENTHAUS_SECRET_KEY }}
      ADMIN_PASSWORD: ${{ secrets.SCENTHAUS_ADMIN_PASSWORD }}
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Check dedicated training connection
        run: test -n "$DATABASE_URL"
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python -m app.ml.train
        working-directory: backend
      - name: Publish validated artifacts for Vercel deployment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/artifacts/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish validated SCENTHAUS model version'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlflow-training-evidence
          path: |
            backend/mlflow.db
            backend/mlruns/
            backend/artifacts/
          retention-days: 90
