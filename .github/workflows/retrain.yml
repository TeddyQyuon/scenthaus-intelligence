name: Scheduled simulated model evaluation
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * 6'
permissions:
  contents: read
concurrency:
  group: scenthaus-simulated-training
  cancel-in-progress: false
jobs:
  retrain:
    if: vars.SCENTHAUS_RETRAIN_ENABLED == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scenthaus
      ADMIN_PASSWORD: ci-only-strong-password-12345
      SECRET_KEY: ci-only-simulated-training-fixture-key-12345
      PYTHONPATH: backend:.
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt'}
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-training.txt
      - run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb scenthaus
          cd backend && alembic upgrade head
      - run: python -m app.seed && python -m ml.train_all
      - run: pytest ml/tests -q && ruff check .
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-model-release-candidate
          retention-days: 14
          path: |
            backend/artifacts/
            ml/reports/
            data/models/*-run.json
            mlflow.db
            mlruns/
