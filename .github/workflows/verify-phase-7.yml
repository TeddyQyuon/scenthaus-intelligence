name: Verify corrected real-catalog browser journeys
on:
  push:
    branches: [restore-workspace]
    paths: [.github/workflows/verify-phase-7.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'TeddyQyuon/scenthaus-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scenthaus
      ADMIN_PASSWORD: ci-only-strong-password-12345
      ADMIN_EMAIL: admin@scenthaus.demo
      SECRET_KEY: ci-only-simulated-fixture-key-at-least-32-characters
      PYTHONPATH: backend:.
      HF_HOME: data/hf-cache
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      TRAINED_SOURCE: ea567bfb52ec4019e585ebce23a4847e8dcc24bc
      VERIFIED_SOURCE: 2e19249ec2030c4b19a1c73336899e1413b78695
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2e19249ec2030c4b19a1c73336899e1413b78695
          fetch-depth: 0
          persist-credentials: false
      - name: Require identical application, training code and dependencies
        run: |
          python - <<'PY'
          import os
          import subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['VERIFIED_SOURCE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['TRAINED_SOURCE'], 'HEAD'], text=True).splitlines()
          assert changed and set(changed) <= {'frontend/e2e/journeys.spec.js'}, changed
          print('Only the browser test file changed from the natively trained and Python-tested source.')
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-training.txt
      - name: Native empty PostgreSQL fixture
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb scenthaus
          cd backend && alembic upgrade head
      - run: python -m app.seed
      - name: Restore immutable artifact from the completed native training run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11389275875
          run-id: 37409637077
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .
      - name: Verify the Python receipt and register the matching model bundle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from app.vercel_init import initialize
          from app.ml.serving import store
          suites = list(ET.parse('data/tests.xml').getroot().iter('testsuite'))
          assert len(suites) == 1
          assert all(int(suites[0].attrib[key]) == 0 for key in ['errors', 'failures', 'skipped'])
          assert int(suites[0].attrib['tests']) == 65
          initialize()
          model = store.get()
          assert model is not None
          for name in ['browser-tests.json', 'home-desktop.png', 'admin-forecast.png']:
              (Path('reports') / name).unlink(missing_ok=True)
          Path('reports/browser-verification.json').write_text(json.dumps({
              'source': os.environ['VERIFIED_SOURCE'],
              'training_source': os.environ['TRAINED_SOURCE'],
              'training_run': 37409637077,
              'training_artifact': 11389275875,
              'python_tests_from_unchanged_source': 65,
              'model_version': model['version'],
              'data_hash': model['metrics']['validation']['data_hash'],
              'fixture': 'fresh native PostgreSQL with simulated records',
          }, indent=2))
          PY
      - name: Start the seeded API and await readiness
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > reports/browser-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat reports/browser-api.log
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-browser-journey-evidence
          retention-days: 7
          path: |
            reports/browser-verification.json
            reports/browser-api.log
            reports/browser-tests.json
            reports/*.png
            frontend/test-results/
