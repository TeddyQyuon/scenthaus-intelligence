name: Verify fragrance-house storefront journeys
on:
  push:
    branches: [restore-workspace]
    paths: [.github/workflows/verify-phase-7.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    if: github.repository == 'TeddyQyuon/scenthaus-intelligence'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scenthaus
      ADMIN_PASSWORD: ci-only-strong-password-12345
      ADMIN_EMAIL: admin@scenthaus.demo
      SECRET_KEY: ci-only-simulated-fixture-key-at-least-32-characters
      PYTHONPATH: backend:.
      HF_HOME: data/hf-cache
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      ALLOWED_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      TRAINED_SOURCE: 2e19249ec2030c4b19a1c73336899e1413b78695
      VERIFIED_SOURCE: 44f670d4aef481acc84a0e696962965cf8bf2e42
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 44f670d4aef481acc84a0e696962965cf8bf2e42
          fetch-depth: 0
          persist-credentials: false
      - name: Require identical training code, dependencies and scoped build-lock changes
        run: |
          python - <<'PY'
          import os
          import subprocess
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['VERIFIED_SOURCE']
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['TRAINED_SOURCE'], 'HEAD'], text=True).splitlines()
          assert set(changed) == {'backend/app/vercel_init.py', 'backend/tests/test_vercel.py', 'PLAN.md', 'README.md', 'docs/deployment.md', 'docs/feature-matrix.md', 'docs/model_cards/forecaster.md', 'docs/model_cards/recommender.md', 'docs/portfolio-entry.md', 'frontend/e2e/journeys.spec.js', 'frontend/src/Admin.jsx', 'frontend/src/App.jsx', 'frontend/src/brands.js', 'frontend/src/styles.css', 'ml/reports/forecast.md', 'ml/reports/operations.md', 'ml/reports/recommender.md', 'reports/deployment.md', 'reports/historical/README.md', 'reports/historical/browser-gut-check.txt', 'reports/historical/browser-tests.txt', 'reports/historical/build.txt', 'reports/historical/latency.json', 'reports/historical/production-api-smoke.json', 'reports/historical/pytest.txt', 'reports/verification.md'}, changed
          print('Only the expected frontend views, styles, directory, browser journeys and documentation changed; the build initializer and its regression tests are the only backend changes; training code and dependencies match the natively tested source.')
          PY
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-training.txt
      - name: Native empty PostgreSQL fixture
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb scenthaus
          cd backend && alembic upgrade head
      - run: python -m app.seed
      - name: Restore immutable artifact from the completed native training run
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 11389448639
          run-id: 37411420198
          github-token: ${{ github.token }}
          merge-multiple: true
          path: .
      - name: Verify the Python receipt and register the matching model bundle
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from app.vercel_init import initialize
          from app.ml.serving import store
          suites = list(ET.parse('data/tests.xml').getroot().iter('testsuite'))
          assert len(suites) == 1
          assert all(int(suites[0].attrib[key]) == 0 for key in ['errors', 'failures', 'skipped'])
          assert int(suites[0].attrib['tests']) == 65
          initialize()
          model = store.get()
          assert model is not None
          for name in ['browser-tests.json', 'home-desktop.png', 'admin-forecast.png']:
              (Path('reports') / name).unlink(missing_ok=True)
          Path('reports/browser-verification.json').write_text(json.dumps({
              'source': os.environ['VERIFIED_SOURCE'],
              'training_source': os.environ['TRAINED_SOURCE'],
              'training_run': 37411420198,
              'training_artifact': 11389448639,
              'prior_native_python_tests': 65,
              'model_version': model['version'],
              'data_hash': model['metrics']['validation']['data_hash'],
              'fixture': 'fresh native PostgreSQL with simulated records',
          }, indent=2))
          PY
      - name: Verify the native PostgreSQL build lock and runtime guards
        run: |
          pytest backend/tests/test_vercel.py -q --junitxml=reports/build-lock-tests.xml
          ruff check .
      - run: npm ci
        working-directory: frontend
      - name: Start the documented native stack and await all three services
        run: |
          nohup python scripts/dev.py > reports/browser-api.log 2>&1 &
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null &&
               curl --fail --silent http://127.0.0.1:5173 > /dev/null &&
               curl --fail --silent http://127.0.0.1:5000/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          cat reports/browser-api.log
          test "$ready" = 1
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fragrance-house-storefront-evidence
          retention-days: 7
          path: |
            reports/build-lock-tests.xml
            reports/browser-verification.json
            reports/browser-api.log
            reports/browser-tests.json
            reports/*.png
            frontend/test-results/
