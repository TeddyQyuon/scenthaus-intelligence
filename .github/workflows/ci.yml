name: Native stack and honest ML evaluation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scenthaus
      SECRET_KEY: ci-only-unique-secret-for-simulated-fixture-tests
      ADMIN_PASSWORD: ci-only-strong-password-12345
      ADMIN_EMAIL: admin@scenthaus.demo
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PYTHONPATH: backend:.
      HF_HOME: data/hf-cache
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NATIVE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: 'backend/requirements*.txt'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements-training.txt
      - name: Native temporary PostgreSQL (no Docker)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb scenthaus
          cd backend && alembic upgrade head
      - name: Generate simulated fixture and train actual models
        run: |
          python -m app.seed
          python -m ml.train_all
      - run: pytest -q --junitxml=data/tests.xml
      - run: ruff check .
      - name: Start the seeded API for browser journeys
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/scenthaus-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8000/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/scenthaus-api.log
          exit 1
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:unit && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-and-serving-evidence
          retention-days: 7
          path: |
            ml/reports/
            data/tests.xml
            data/models/*-run.json
            backend/artifacts/
            mlflow.db
            mlruns/
            reports/*.png
            reports/browser-tests.json
            frontend/test-results/
