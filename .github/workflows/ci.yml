name: Test storefront and Python intelligence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scenthaus
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U postgres'
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/scenthaus
      SECRET_KEY: ci-only-unique-secret-for-non-production-tests
      ADMIN_PASSWORD: ci-only-strong-password-12345
      ADMIN_EMAIL: admin@scenthaus.demo
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 2
      NATIVE_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements-dev.txt
        working-directory: backend
      - run: alembic upgrade head
        working-directory: backend
      - run: python -m app.seed && python -m app.ml.train
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
      - run: npm ci && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: uvicorn app.main:app --host 127.0.0.1 --port 8000 > ../reports/ci-api.log 2>&1 &
        working-directory: backend
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            reports/
            frontend/test-results/
            backend/artifacts/evaluation.json
